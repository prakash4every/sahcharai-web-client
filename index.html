<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SahcharAI - Gemini Web Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #4a148c;
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title h1 { font-size: 1.3rem; }
        .bot-selector {
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }
        .speaker-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 1.2rem;
            margin-right: 8px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f5f5f5;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background: white;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .typing-indicator {
            background: white;
            padding: 12px 16px;
            border-radius: 20px;
            align-self: flex-start;
            display: none;
            gap: 4px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite;
        }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
        .input-area {
            padding: 12px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        .input-row { display: flex; gap: 8px; }
        .input-row input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 28px;
            font-size: 1rem;
            outline: none;
        }
        .btn-send {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 28px;
            cursor: pointer;
            font-size: 1rem;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .mic-btn { background: #4a148c; color: white; }
        .mic-btn.listening { background: #4caf50; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .footer {
            text-align: center;
            padding: 8px;
            font-size: 0.65rem;
            color: #888;
            background: white;
            border-top: 1px solid #eee;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
        }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; }
        .modal-buttons button { padding: 8px 16px; border-radius: 20px; cursor: pointer; border: none; }
        .modal-buttons button:first-child { background: #667eea; color: white; }
        .modal-buttons button:last-child { background: #ccc; }
        button {
            cursor: pointer;
        }
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin: 5px;
        }
        .image-container {
            max-width: 100%;
            margin-top: 8px;
        }
        .image-container img {
            max-width: 200px;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="chat-header">
            <div class="header-title">
                <h1>🤖 SahcharAI</h1>
            </div>
            <div>
                <button class="speaker-btn" id="globalSpeaker" onclick="toggleAutoSpeak()">🔊</button>
                <span class="bot-selector" id="botSelector" onclick="showBotSelector()">🤖 SahcharAI ▼</span>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="message bot-message">नमस्ते! मैं SahcharAI हूँ। आपकी कैसे मदद कर सकता हूँ? 🙏</div>
        </div>

        <div class="typing-indicator" id="typing"><span></span><span></span><span></span></div>

        <div class="input-area">
            <div class="input-row">
                <input type="text" id="userInput" placeholder="अपना सवाल लिखें..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" id="sendButton" onclick="sendMessage()">भेजें</button>
            </div>
            <div class="action-buttons">
                <button class="action-btn mic-btn" id="micBtn" onclick="startVoiceInput()">🎤 बोलें</button>
                <button class="action-btn" onclick="showImageGenModal()">🎨 इमेज बनाएं</button>
                <button class="action-btn" onclick="showVideoGenModal()" style="background:#ff5722;color:white">🎬 वीडियो</button>
            </div>
        </div>
        <div class="footer">राम प्रकाश कुमार द्वारा निर्मित | Firebase AI द्वारा संचालित</div>
    </div>

    <!-- Bot Modal -->
    <div class="modal" id="botModal">
        <div class="modal-content">
            <h3>बॉट चुनें</h3>
            <button style="width:100%; margin:5px 0; padding:10px; border:none; border-radius:20px;" onclick="switchBot('SahcharAI')">🤖 SahcharAI</button>
            <button style="width:100%; margin:5px 0; padding:10px; border:none; border-radius:20px;" onclick="switchBot('SahcharAssistant')">👨‍💼 SahcharAssistant</button>
            <button style="width:100%; margin:5px 0; padding:10px; border:none; border-radius:20px;" onclick="switchBot('SuperSahchar')">⭐ SuperSahchar</button>
            <div class="modal-buttons"><button onclick="closeBotModal()">बंद करें</button></div>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <h3>🎨 इमेज बनाएं</h3>
            <input type="text" id="imagePrompt" placeholder="तस्वीर का विवरण लिखें...">
            <div class="modal-buttons">
                <button onclick="generateImage()">बनाएं</button>
                <button onclick="closeImageModal()">रद्द करें</button>
            </div>
        </div>
    </div>

    <!-- Video Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <h3>🎬 वीडियो बनाएं</h3>
            <input type="text" id="videoPrompt" placeholder="वीडियो का विवरण लिखें...">
            <div class="modal-buttons">
                <button onclick="generateVideo()">बनाएं</button>
                <button onclick="closeVideoModal()">रद्द करें</button>
            </div>
        </div>
    </div>

    <script>
        // ========== ✅ FIXED: FIREBASE BACKEND URL (WORKING) ==========
        const FIREBASE_URL = 'https://api-5n6fh3d24a-uc.a.run.app';
        
        // ========== APP STATE ==========
        let currentBot = 'SahcharAI';
        let autoSpeak = true;
        
        // ========== DOM ELEMENTS ==========
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const typingDiv = document.getElementById('typing');
        const sendButton = document.getElementById('sendButton');
        
        // ========== HELPER FUNCTIONS ==========
        function addMessage(text, isUser, isImage = false, imageUrl = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            if (isImage && imageUrl) {
                msgDiv.textContent = text;
                const img = document.createElement('img');
                img.src = imageUrl;
                img.style.maxWidth = '200px';
                img.style.borderRadius = '12px';
                img.style.marginTop = '8px';
                img.style.cursor = 'pointer';
                img.onclick = () => window.open(imageUrl, '_blank');
                msgDiv.appendChild(img);
            } else {
                msgDiv.textContent = text;
            }
            
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            if (!isUser && autoSpeak) speakText(text);
        }
        
        function addError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = '❌ ' + message;
            messagesDiv.appendChild(errorDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function speakText(text) {
            if (!autoSpeak || !text) return;
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.9;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            } catch(e) { console.error("Speech error:", e); }
        }
        
        function showTyping(show) {
            typingDiv.style.display = show ? 'flex' : 'none';
        }
        
        // ========== BACKEND API CALL ==========
        async function callBackendAPI(message) {
            console.log("📡 Calling Firebase backend...");
            
            let endpoint = '/chat';
            if (currentBot === 'SahcharAssistant') endpoint = '/chat-assistant';
            else if (currentBot === 'SuperSahchar') endpoint = '/chat-nvidia';
            
            try {
                const response = await fetch(`${FIREBASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message, 
                        sessionId: localStorage.getItem('session_id') || 'web_user',
                        bot: currentBot 
                    })
                });
                
                const data = await response.json();
                console.log("✅ Backend response:", data);
                
                return data.reply || data.message || "क्षमा करें, उत्तर नहीं मिला।";
            } catch (error) {
                console.error("❌ Backend error:", error);
                return null;
            }
        }
        
        // ========== SEND MESSAGE ==========
        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text) return;
            
            console.log("📤 Sending message:", text);
            addMessage(text, true);
            userInput.value = '';
            showTyping(true);
            
            const backendReply = await callBackendAPI(text);
            
            if (backendReply) {
                showTyping(false);
                addMessage(backendReply, false);
            } else {
                showTyping(false);
                addError("सर्वर से कनेक्ट नहीं हो पाया। कृपया पुनः प्रयास करें।");
            }
        };
        
        window.handleKeyPress = function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        };
        
        // ========== VOICE INPUT ==========
        let recognition = null;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onstart = () => {
                const micBtn = document.getElementById('micBtn');
                micBtn.innerHTML = '🎤 सुन रहा हूँ...';
                micBtn.classList.add('listening');
            };
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                if (transcript) {
                    userInput.value = transcript;
                    sendMessage();
                }
                recognition.stop();
            };
            recognition.onend = () => {
                const micBtn = document.getElementById('micBtn');
                micBtn.innerHTML = '🎤 बोलें';
                micBtn.classList.remove('listening');
            };
            recognition.onerror = () => {
                const micBtn = document.getElementById('micBtn');
                micBtn.innerHTML = '🎤 बोलें';
                micBtn.classList.remove('listening');
            };
        }
        
        window.startVoiceInput = function() {
            if (!recognition) { alert('Chrome browser use करें।'); return; }
            try { recognition.start(); } catch(e) { console.error("Voice error:", e); }
        };
        
        // ========== IMAGE GENERATION ==========
        window.showImageGenModal = () => document.getElementById('imageModal').style.display = 'flex';
        window.closeImageModal = () => document.getElementById('imageModal').style.display = 'none';
        
        window.generateImage = async function() {
            const prompt = document.getElementById('imagePrompt').value.trim();
            if (!prompt) { alert('प्रॉम्प्ट लिखें'); return; }
            
            closeImageModal();
            addMessage(`🎨 ${prompt}`, true);
            showTyping(true);
            
            try {
                // Call Firebase backend for image generation
                const response = await fetch(`${FIREBASE_URL}/image`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, bot: currentBot })
                });
                
                const data = await response.json();
                showTyping(false);
                
                if (data.imageUrl || data.url) {
                    const imageUrl = data.imageUrl || data.url;
                    addMessage('✅ ये रही आपकी इमेज:', false, true, imageUrl);
                } else {
                    addMessage('❌ इमेज जनरेट नहीं हुई। पुनः प्रयास करें।', false);
                }
            } catch (error) {
                showTyping(false);
                addMessage('❌ त्रुटि: ' + error.message, false);
            }
            
            document.getElementById('imagePrompt').value = '';
        };
        
        // ========== VIDEO GENERATION ==========
        window.showVideoGenModal = () => document.getElementById('videoModal').style.display = 'flex';
        window.closeVideoModal = () => document.getElementById('videoModal').style.display = 'none';
        
        window.generateVideo = async function() {
            const prompt = document.getElementById('videoPrompt').value.trim();
            if (!prompt) { alert('प्रॉम्प्ट लिखें'); return; }
            
            closeVideoModal();
            addMessage(`🎬 ${prompt}`, true);
            showTyping(true);
            
            try {
                const response = await fetch(`${FIREBASE_URL}/video`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, bot: currentBot })
                });
                
                const data = await response.json();
                showTyping(false);
                
                if (data.videoUrl || data.url) {
                    const vidUrl = data.videoUrl || data.url;
                    const story = data.story || '✅ आपका वीडियो तैयार है!';
                    addMessage(story, false);

                    const linkDiv = document.createElement('div');
                    linkDiv.className = 'message bot-message';
                    const a = document.createElement('a');
                    a.href = vidUrl;
                    a.target = '_blank';
                    a.textContent = '🎬 वीडियो देखें (Click Here)';
                    a.style.color = '#4a148c';
                    a.style.fontWeight = 'bold';
                    a.style.textDecoration = 'none';
                    linkDiv.appendChild(a);
                    messagesDiv.appendChild(linkDiv);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                } else {
                    addMessage('❌ वीडियो जनरेट नहीं हो सका। पुनः प्रयास करें।', false);
                }
            } catch (error) {
                showTyping(false);
                addMessage('❌ त्रुटि: ' + error.message, false);
            }
            
            document.getElementById('videoPrompt').value = '';
        };
        
        // ========== BOT SWITCHING ==========
        window.showBotSelector = () => document.getElementById('botModal').style.display = 'flex';
        window.closeBotModal = () => document.getElementById('botModal').style.display = 'none';
        
        window.switchBot = function(botName) {
            currentBot = botName;
            const selector = document.getElementById('botSelector');
            if (botName === 'SahcharAI') selector.innerHTML = '🤖 SahcharAI ▼';
            else if (botName === 'SahcharAssistant') selector.innerHTML = '👨‍💼 SahcharAssistant ▼';
            else selector.innerHTML = '⭐ SuperSahchar ▼';
            closeBotModal();
            addMessage(`नमस्ते! मैं ${botName} हूँ। 🙏`, false);
        };
        
        // ========== SPEAKER TOGGLE ==========
        window.toggleAutoSpeak = function() {
            autoSpeak = !autoSpeak;
            const btn = document.getElementById('globalSpeaker');
            btn.innerHTML = autoSpeak ? '🔊' : '🔇';
        };
        
        // ========== TEST CONNECTION ==========
        async function testConnection() {
            try {
                const response = await fetch(`${FIREBASE_URL}/health`);
                const data = await response.json();
                console.log("✅ Firebase connection successful:", data);
                addMessage("✅ बैकएंड से कनेक्टेड! अब आप मुझसे बात कर सकते हैं।", false);
            } catch (error) {
                console.error("❌ Firebase connection failed:", error);
                addError("बैकएंड से कनेक्ट नहीं हो पाया। कृपया पुनः प्रयास करें।");
            }
        }
        
        // ========== INITIALIZE ==========
        console.log("🚀 App starting...");
        console.log("🔗 Firebase URL:", FIREBASE_URL);
        testConnection();
        
        // Enable input after load
        userInput.disabled = false;
        sendButton.disabled = false;
    </script>
</body>
</html>
